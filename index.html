<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <script>
      ;(() => {
        try {
          const preference = localStorage.getItem('smartplanner.theme.v1')
          const dark =
            preference === 'dark' ||
            ((!preference || preference === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document.documentElement.style.backgroundColor = dark ? '#020617' : '#f8fafc'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f8fafc')
        } catch {
          // Ignore unavailable storage or matchMedia.
        }
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SmartPlanner" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="SmartPlanner: organizza le notti in stanza e i giorni di presenza con il tuo collega."
    />
    <title>SmartPlanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
